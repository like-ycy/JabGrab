name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发只跑构建、不发版，方便先调通流水线
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 与 x64 各用一台原生 runner：Python 侧车（jab-scrape）由 PyInstaller
          # 打包，只能出本机架构，交叉编译会做出「主程序 x64 + 侧车 arm64」的半成品。
          - goarch: arm64
            runner: macos-15
            dlre: osx-arm64
          - goarch: amd64
            runner: macos-15-intel
            dlre: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: 校验发布标签
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "手动触发：跳过标签校验，产物仅作为 artifact 保留"
            exit 0
          fi
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "发布标签必须形如 vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不维护浮动主版本标签，只能写完整版本
        with:
          # enable-cache 默认 auto，tag 推送时不会启用缓存，这里显式打开
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # 仓库内置的是 arm64 版下载器，Intel 构建要换 x64 那份
      - name: 准备 N_m3u8DL-RE
        if: matrix.dlre == 'osx-x64'
        run: bash scripts/fetch-dlre.sh osx-x64

      - name: 写入版本号
        working-directory: go
        run: |
          node -e 'const fs=require("fs");const v=process.env.GITHUB_REF_TYPE==="tag"?process.env.GITHUB_REF_NAME.replace(/^v/,""):"0.0.0-dev";const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:v};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: 打包 Python 爬取程序
        run: bash scripts/build-py.sh

      # 冻结产物冒烟：--help 会走完整条 import 链（含 seleniumbase），能在几分钟的
      # wails 构建之前就暴露「资源没收进 _internal」这类只在运行时才发作的问题。
      - name: 侧车冒烟测试
        run: ./python/build/pyi/dist/jab-scrape/jab-scrape --help >/dev/null

      - name: 构建 macOS 应用
        working-directory: go
        run: |
          WAILS_VER="$(grep -oE 'wailsapp/wails/v2 v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | awk '{print $2}')"
          go run "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}" build \
            -clean \
            -platform "darwin/${{ matrix.goarch }}"

      - name: 组装并打包
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          PKG="$PWD/jabgrab_${VERSION}_darwin_${{ matrix.goarch }}.zip"
          rm -rf staging
          mkdir -p staging
          cp -R go/build/bin/jabgrab.app staging/JabGrab.app
          cp go/third_party/N_m3u8DL-RE staging/N_m3u8DL-RE
          cp -R python/build/pyi/dist/jab-scrape staging/python
          chmod +x staging/N_m3u8DL-RE staging/python/jab-scrape
          # 三件套能被互相定位才算打包合格（runner 与目标架构同源，自检必须通过）
          ./staging/JabGrab.app/Contents/MacOS/jabgrab --selftest
          # -y 保留 .app 内符号链接，否则系统解压后应用包会损坏
          (cd staging && zip -qyr "$PKG" JabGrab.app N_m3u8DL-RE python)
          # 先落盘再 grep，避免 grep -q 提前退出把 unzip 顶成 SIGPIPE（pipefail 会因此判失败）
          LIST="$(unzip -l "$PKG")"
          grep -q 'JabGrab.app/Contents/MacOS/jabgrab' <<<"$LIST"
          grep -q 'python/jab-scrape' <<<"$LIST"
          du -h "$PKG"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.goarch }}
          path: jabgrab_*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: 校验发布标签
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "手动触发：跳过标签校验，产物仅作为 artifact 保留"
            exit 0
          fi
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "发布标签必须形如 vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不维护浮动主版本标签，只能写完整版本
        with:
          # enable-cache 默认 auto，tag 推送时不会启用缓存，这里显式打开
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # N_m3u8DL-RE.exe 已随仓库内置，这里只确认它没被漏掉
      - name: 检查 Windows 版下载器
        shell: pwsh
        run: |
          $dlr = 'go/third_party/N_m3u8DL-RE.exe'
          if (-not (Test-Path $dlr)) { throw "缺少 $dlr" }
          (Get-Item $dlr).Length

      - name: 写入版本号
        working-directory: go
        run: node -e 'const fs=require("fs");const v=process.env.GITHUB_REF_TYPE==="tag"?process.env.GITHUB_REF_NAME.replace(/^v/,""):"0.0.0-dev";const p=JSON.parse(fs.readFileSync("wails.json","utf8"));p.info={...(p.info||{}),productVersion:v};fs.writeFileSync("wails.json",JSON.stringify(p,null,2)+"\n");'

      - name: 打包 Python 爬取程序
        shell: bash
        run: bash scripts/build-py.sh

      # 冻结产物冒烟：--help 会走完整条 import 链（含 seleniumbase）。
      # 两个 PYTHON* 变量不是可有可无的：Windows 控制台默认 ANSI 代码页编不了中文，
      # --help 里的中文说明会直接 UnicodeEncodeError —— 这正是运行时 jab-scrape
      # 输出中文 JSON 遇到的同一个坑（Go 侧在 internal/scraper 里已强制 UTF-8）。
      - name: 侧车冒烟测试
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          & 'python\build\pyi\dist\jab-scrape\jab-scrape.exe' --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "jab-scrape --help 退出码 $LASTEXITCODE" }

      - name: 构建 Windows 应用
        shell: bash
        working-directory: go
        run: |
          WAILS_VER="$(grep -oE 'wailsapp/wails/v2 v[0-9]+\.[0-9]+\.[0-9]+' go.mod | head -1 | awk '{print $2}')"
          go run "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}" build \
            -clean \
            -platform windows/amd64

      - name: 组装发行目录
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          New-Item -ItemType Directory -Path dist | Out-Null
          if (-not (Test-Path 'go/build/bin/jabgrab.exe')) { throw 'missing jabgrab.exe' }
          Copy-Item 'go/build/bin/jabgrab.exe' dist
          Copy-Item 'go/third_party/N_m3u8DL-RE.exe' dist
          Copy-Item 'python/build/pyi/dist/jab-scrape/*' dist -Recurse -Force

          # 先做文件系统断言：三件套必须平铺在同一层，_internal 与 jab-scrape.exe 同级。
          # 结构错了用户侧表现为「找不到下载器/爬取组件」，而日志一片绿，所以在这里拦。
          foreach ($p in @('dist\jabgrab.exe', 'dist\N_m3u8DL-RE.exe',
                           'dist\jab-scrape.exe', 'dist\_internal')) {
            if (-not (Test-Path $p)) { throw "分发目录缺少：$p" }
          }

          # 再从最终位置真跑一次。
          # 必须用 Start-Process -Wait：wails 生产构建会给 Windows 产物加 -H windowsgui
          # （wails v2 pkg/commands/build/base.go），产物是 GUI 子系统程序，PowerShell 用
          # & 调用不会等待它退出，$LASTEXITCODE 保持初始的 $null，而 $null -ne 0 为真，
          # 于是自检明明通过也会被误判成失败。
          $proc = Start-Process -FilePath "$PWD\dist\jabgrab.exe" -ArgumentList '--selftest' `
            -NoNewWindow -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "自检退出码 $($proc.ExitCode)" }

      - name: 打包 Windows 发行包
        # 在 dist 目录内压缩，保证 zip 根目录就是 jabgrab.exe / jab-scrape.exe / _internal
        shell: pwsh
        run: |
          $VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          $PKG = Join-Path $PWD "jabgrab_${VERSION}_windows_amd64.zip"
          Push-Location dist
          try {
            Compress-Archive -Path * -DestinationPath $PKG -Force
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $PKG)) { throw "failed to create $PKG" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($PKG)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            foreach ($need in @('jabgrab.exe','N_m3u8DL-RE.exe','jab-scrape.exe')) {
              if ($names -notcontains $need) {
                throw "zip 根目录缺少 $need；实际条目：$($names -join ', ')"
              }
            }
            if (-not ($names -like '_internal/*')) { throw 'zip 里缺少 _internal' }
          } finally {
            $zip.Dispose()
          }
          '{0:N1} MB' -f ((Get-Item $PKG).Length / 1MB)

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: jabgrab_*.zip
          if-no-files-found: error

  release:
    needs: [macos, windows]
    # 只在推送 tag 时发布；手动触发即使 --ref 指向 tag 也只出 artifact
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA256SUMS
        run: |
          shopt -s nullglob
          packages=(release-assets/*.zip)
          test "${#packages[@]}" -eq 3
          (
            cd release-assets
            sha256sum ./*.zip > SHA256SUMS.txt
          )
          echo "SHA256SUMS:"
          cat release-assets/SHA256SUMS.txt

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/SHA256SUMS.txt)
          test "${#assets[@]}" -eq 4
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "JabGrab $GITHUB_REF_NAME" \
              --generate-notes
          fi
