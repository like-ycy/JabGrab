name: Release

# 构建与打包全部收在 tools/build.sh（macOS）与 tools\build.ps1（Windows）里：
# 本地一条命令能复现的东西，才有资格只在 CI 里跑一次。这里只负责
# 「换平台 → 取下载器 → 调脚本 → 断言产物 → 传 artifact」。
#
# 产物命名（与 go/internal/locate、cmd/manifestgen 的约定一致）：
#   jabgrab_<ver>[_full]_<goos>_<goarch>.zip
#   scraper_<ver>_<goos>_<goarch>.zip / dlre_<ver>_<goos>_<goarch>.zip
# 平台段取 GOOS（darwin/windows），不要写成 macos。

on:
  push:
    tags:
      - 'v*'
  # 手动触发只跑构建、不发版，方便先调通流水线
  workflow_dispatch:

permissions:
  contents: write

# 资产一共 14 个：3 标准包 + 3 整包 + 3 组件包(scraper) + 3 组件包(dlre)
# + manifest.json + SHA256SUMS.txt。见 docs/release-split-plan.md §2。
env:
  ALL_PLATFORMS: 'windows/amd64,darwin/arm64,darwin/amd64'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 与 x64 各用一台原生 runner：Python 侧车（jab-scrape）由 PyInstaller
          # 打包，只能出本机架构；N_m3u8DL-RE 也要对应架构的那一份。
          - goos: darwin
            goarch: arm64
            runner: macos-15
            dlre: osx-arm64
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            dlre: osx-x64
          - goos: windows
            goarch: amd64
            runner: windows-2022
            dlre: win-x64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验发布标签
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "手动触发：跳过标签校验，产物仅作为 artifact 保留"
            exit 0
          fi
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "发布标签必须形如 vMAJOR.MINOR.PATCH"
            exit 1
          }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Windows 进程停止回归测试
        if: runner.os == 'Windows'
        working-directory: go
        run: go test ./internal/proc -v -timeout 90s

      - uses: astral-sh/setup-uv@v10.3.3  # 该 action 不维护浮动主版本标签，只能写完整版本
        with:
          # enable-cache 默认 auto，tag 推送时不会启用缓存，这里显式打开
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      # build.sh / build.ps1 直接调 `wails build`，所以 CLI 必须在 PATH 上。
      # go install 落在 $(go env GOPATH)/bin，不追加到 GITHUB_PATH 后面就是
      # 「未找到 wails CLI」。
      - name: 安装 Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # 不用仓库里内置的那份：CI 现拉能保证与本文件钉住的 sha256 一致，也就保证
      # 三个平台拿到的是同一个上游构建。仓库里那份只是本地开发时的便利副本。
      # 脚本的默认落点就是 third_party/dlre/<os>-<arch>/。
      - name: 取 N_m3u8DL-RE
        shell: bash
        run: bash tools/fetch-dlre.sh ${{ matrix.dlre }}

      # 发布构建才生成内置兜底清单（清单里的地址是 releases/download/<tag>）；
      # 本地构建不设 RELEASE_TAG，prebuild.sh 会保持仓库里的空清单。
      - name: Build (macOS)
        if: runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: tools/build.sh --full

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: .\tools\build.ps1 -Full

      # 结构断言：目录名或组件位置对不上时，用户那边表现为「未找到组件」，
      # 而构建日志一片绿。整包里还要真跑一次组件与会话自检。
      - name: Assert layout (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          version="$(git describe --tags --exact-match 2>/dev/null | sed 's/^v//' || echo 0.0.0-dev)"
          lite="dist/release/jabgrab_${version}_darwin_${{ matrix.goarch }}.zip"
          full="dist/release/jabgrab_${version}_full_darwin_${{ matrix.goarch }}.zip"
          test -f "$lite" && test -f "$full" || { echo "缺少归档"; ls -R dist/release; exit 1; }

          names="$(unzip -Z1 "$full")"
          for need in "JabGrab/JabGrab.app/Contents/MacOS/jabgrab" \
                      "JabGrab/tools/scraper/jab-scrape" \
                      "JabGrab/tools/dlre/N_m3u8DL-RE"; do
            grep -qx "$need" <<<"$names" || { echo "整包缺少 $need"; exit 1; }
          done
          stray="$(grep -v '^JabGrab/' <<<"$names" || true)"
          if [ -n "$stray" ]; then echo "整包顶层不是单一的 JabGrab/：$stray"; exit 1; fi

          # 标准包必须不含 tools/：它是「拷组件之前的那棵树」。
          # 先落名单再用 here-string：`unzip | grep -q` 里 grep 一命中就退出，
          # unzip 被 SIGPIPE 顶死（141），pipefail 下这个检查会静默通过 ——
          # 越是有问题越查不出来。
          names_lite="$(unzip -Z1 "$lite")"
          if grep -q '^JabGrab/tools/' <<<"$names_lite"; then
            echo "标准包里出现了 tools/"; exit 1
          fi

          ./dist/JabGrab/JabGrab.app/Contents/MacOS/jabgrab --selftest || true
          ./dist/JabGrab/tools/scraper/jab-scrape --selftest
          ./dist/JabGrab/tools/dlre/N_m3u8DL-RE --version | head -2

      - name: Assert layout (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { (git describe --tags --exact-match 2>$null) -replace '^v','' }
          if (-not $version) { $version = '0.0.0-dev' }
          $lite = "dist\release\jabgrab_${version}_windows_amd64.zip"
          $full = "dist\release\jabgrab_${version}_full_windows_amd64.zip"
          foreach ($p in @($lite, $full)) { if (-not (Test-Path $p)) { throw "缺少归档：$p" } }

          $zip = [System.IO.Compression.ZipFile]::OpenRead((Join-Path $PWD $full))
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\','/' })
            foreach ($need in @('JabGrab/jabgrab.exe', 'JabGrab/tools/scraper/jab-scrape.exe', 'JabGrab/tools/dlre/N_m3u8DL-RE.exe')) {
              if ($names -notcontains $need) { throw "整包缺少 $need" }
            }
            $stray = @($names | Where-Object { -not $_.StartsWith('JabGrab/') })
            if ($stray.Count -gt 0) { throw "整包顶层不是单一的 JabGrab/" }
          } finally { $zip.Dispose() }

          & .\dist\JabGrab\tools\scraper\jab-scrape.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw 'scraper 自检失败' }

      - uses: actions/upload-artifact@v7
        with:
          name: jabgrab-${{ matrix.goos }}-${{ matrix.goarch }}
          # 组件自述（*_meta_*.json）也要传：release job 生成 manifest.json 时要用。
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [build]
    # 只在推送 tag 时发布；手动触发即使 --ref 指向 tag 也只出 artifact
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      # 合成清单要用 go/cmd/manifestgen，需要源码与 Go 工具链。
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache: false

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: 收集 Release 资产
        run: |
          set -euo pipefail
          # 用「临时数组 + while read」而不是 mapfile：后者把脚本锁死在 bash 4+，
          # 本地（macOS 自带 3.2）就没法原样跑一遍。发布脚本恰恰最需要本地预演。
          collect() {
            local -a out=()
            while IFS= read -r file; do out+=("$file"); done < <(find release-assets -type f "$@" | sort)
            printf '%s\n' "${out[@]}"
          }

          # 标准包与整包分开匹配：文件名只差一个 _full_，用同一个模式会把整包
          # 算进标准包 —— 数量对得上，而「默认下载项」可能是 60MB 的整包。
          lite=()
          while IFS= read -r file; do lite+=("$file"); done < <(collect \
            \( -name 'jabgrab_*_darwin_arm64.zip' -o -name 'jabgrab_*_darwin_amd64.zip' \
               -o -name 'jabgrab_*_windows_amd64.zip' \) ! -name '*_full_*')
          full=()
          while IFS= read -r file; do full+=("$file"); done < <(collect \
            \( -name 'jabgrab_*_full_darwin_arm64.zip' -o -name 'jabgrab_*_full_darwin_amd64.zip' \
               -o -name 'jabgrab_*_full_windows_amd64.zip' \))
          scrapers=()
          while IFS= read -r file; do scrapers+=("$file"); done < <(collect -name 'scraper_*.zip')
          dlres=()
          while IFS= read -r file; do dlres+=("$file"); done < <(collect -name 'dlre_*.zip')
          metas=()
          while IFS= read -r file; do metas+=("$file"); done < <(collect \( -name 'scraper_meta_*.json' -o -name 'dlre_meta_*.json' \))

          failed=0
          check() {
            if [[ "$2" -ne "$3" ]]; then
              echo "$1 应有 $3 个，实际 $2 个" >&2
              failed=1
            fi
          }
          check "标准包" "${#lite[@]}" 3
          check "整包" "${#full[@]}" 3
          check "scraper 组件包" "${#scrapers[@]}" 3
          check "dlre 组件包" "${#dlres[@]}" 3
          check "组件自述" "${#metas[@]}" 6
          if [[ "$failed" -ne 0 ]]; then
            find release-assets -type f >&2
            exit 1
          fi

          mkdir -p release-pkg
          cp "${lite[@]}" "${full[@]}" "${scrapers[@]}" "${dlres[@]}" "${metas[@]}" release-pkg/

      - name: 生成组件清单
        run: |
          set -euo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # 两次调用、-merge 累加：每个组件的包名、可执行文件名、版本来源都不同。
          # 生成器会自己用 App 的解析路径（ParseManifest + Spec）把结果读一遍，
          # 读不懂就失败 —— 清单挂到 Release 之后才发现问题，代价是用户那边
          # 「组件装不上」而日志里只有一个看不懂的解析错误。
          ( cd go && go run ./cmd/manifestgen -dir ../release-pkg -base-url "$BASE" \
              -name scraper -binary jab-scrape -merge \
              -require "$ALL_PLATFORMS" -out ../release-pkg/manifest.json )
          ( cd go && go run ./cmd/manifestgen -dir ../release-pkg -base-url "$BASE" \
              -name dlre -binary N_m3u8DL-RE -merge \
              -require "$ALL_PLATFORMS" -out ../release-pkg/manifest.json )

          # 自述只是这一段的输入，不发布：清单里已有同样的信息，多六个 json
          # 只会让下载列表更难挑。它们仍留在 artifact 里，需要时能从 Actions 取。
          rm -f release-pkg/scraper_meta_*.json release-pkg/dlre_meta_*.json
          cat release-pkg/manifest.json
          ls -l release-pkg

      - name: 生成 SHA256SUMS
        run: |
          shopt -s nullglob
          packages=(release-pkg/*.zip)
          test "${#packages[@]}" -eq 12
          (
            cd release-pkg
            sha256sum ./*.zip manifest.json > SHA256SUMS.txt
          )
          echo "SHA256SUMS:"
          cat release-pkg/SHA256SUMS.txt

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          assets=(release-pkg/*.zip release-pkg/manifest.json release-pkg/SHA256SUMS.txt)
          # 数量写死是有意的：将来多一个组件包时这里会失败，逼着人回来确认
          # 新资产确实该发，而不是无声地多发一个包。
          test "${#assets[@]}" -eq 14
          for asset in "${assets[@]}"; do
            basename "$asset"
          done

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "JabGrab $GITHUB_REF_NAME" \
              --generate-notes
          fi
